  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b1a15;
      color: #dae4e0;
    }

    .glass {
      background: rgba(18, 43, 34, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(4, 84, 60, 0.2);
    }

    .glass-strong {
      background: rgba(18, 43, 34, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(4, 84, 60, 0.25);
    }

    .glow {
      box-shadow: 0 0 20px rgba(4, 84, 60, 0.15), 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .glow-accent {
      box-shadow: 0 0 24px rgba(4, 84, 60, 0.4);
    }

    .gradient-text {
      background: linear-gradient(135deg, #06755a, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-btn {
      background: linear-gradient(135deg, #04543C, #06755a);
    }

    .gradient-btn:hover {
      background: linear-gradient(135deg, #06755a, #04543C);
    }

    .fab {
      position: fixed;
      bottom: 88px;
      right: 16px;
      z-index: 40;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .fab:hover {
      transform: scale(1.1);
    }

    .fab:active {
      transform: scale(0.95);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    @keyframes slideRight {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(0)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    .animate-slideUp {
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out;
    }

    .animate-cardIn {
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .nav-indicator {
      transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none
    }

    input,
    select,
    textarea {
      background: rgba(18, 43, 34, 0.8) !important;
      border: 1px solid rgba(4, 84, 60, 0.25) !important;
      color: #dae4e0 !important;
      border-radius: 12px !important;
      padding: 12px 14px !important;
      font-size: 15px !important;
      outline: none !important;
      transition: border-color 0.2s !important;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Lora', Georgia, serif !important;

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #06755a !important;
      box-shadow: 0 0 0 3px rgba(4, 84, 60, 0.2) !important;
    }

    input::placeholder {
      color: #5a7a6f !important
    }

    .toast-enter {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)
    }

    .fc-red {
      color: #f87171;
    }

    @media print {
      body, html { 
        background: white !important; 
        color: black !important; 
        font-size: 12pt;
      }
      .glass, .glass-strong, .glow, .glow-accent { 
        background: transparent !important; 
        backdrop-filter: none !important; 
        border: none !important; 
        box-shadow: none !important; 
      }
      .gradient-text { 
        -webkit-text-fill-color: black !important; 
        background: none !important; 
        color: black !important;
      }
      nav, [role="navigation"], .material-icons-round, button:not(.print-btn), .FAB, .BottomNav, .toast, .no-print, .print\:hidden { 
        display: none !important;

      #root {

      .md\:pl-\[260px\] { padding-left: 0 !important; }
      .pb-24, .pb-20, .pt-4, .pt-8 { padding-top: 0 !important; padding-bottom: 0 !important; }

      .border-b { border-bottom: 1px solid #eee !important; }
    }

  <script>
    // ═══════════════════════════════════════════════════
    // FIREBASE CONFIG
    // ═══════════════════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyB_IbttZIxBLwD18zseNDhv6RdpZbewE7A",
      authDomain: "imhi-traiteur.firebaseapp.com",
      databaseURL: "https://imhi-traiteur-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "imhi-traiteur",
      storageBucket: "imhi-traiteur.firebasestorage.app",
      messagingSenderId: "363837718744",
      appId: "1:363837718744:web:639df445a6aa7ed81957ad"
    };
    let fbReady = false;
    try { firebase.initializeApp(firebaseConfig); fbReady = !firebaseConfig.apiKey.startsWith('VOTRE'); } catch (e) { }


    // DATA LAYER
    // ═══════════════════════════════════════════════════
    const CATEGORIES = ['Poisson', 'Viande', 'Epicerie', 'Fruits et légumes', 'Surgelés', 'Crèmerie', 'Alcool', 'Softs', 'Vins et moussants', 'Alcool spiritueux', 'Fournitures d\'exploitation'];

    const EVENT_STATUSES = {
      prop_a_faire: { label: 'Proposition à faire', color: 'bg-amber-500/20 text-amber-300', dot: 'bg-amber-400' },
      accord_verbal: { label: 'Accord verbal', color: 'bg-lime-500/20 text-lime-300', dot: 'bg-lime-400' },
      attente_signature: { label: 'Attente signature', color: 'bg-cyan-500/20 text-cyan-300', dot: 'bg-cyan-400' },
      retravail: { label: 'Retravail du devis', color: 'bg-orange-500/20 text-orange-300', dot: 'bg-orange-400' },
      signe: { label: 'Signé', color: 'bg-emerald-500/20 text-emerald-300', dot: 'bg-emerald-400' }
    };
    const getEvStatus = (s) => (s && EVENT_STATUSES[s]) ? EVENT_STATUSES[s] : EVENT_STATUSES.prop_a_faire;

    const DB = {
      _local: { get(k) { try { return JSON.parse(localStorage.getItem('t_' + k)) || {} } catch (e) { return {} } }, set(k, d) { localStorage.setItem('t_' + k, JSON.stringify(d)) } },
      _id() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); },
      subscribe(cb) {
        if (fbReady) { firebase.database().ref('/').on('value', s => { const d = s.val() || {}; cb({ produits: Object.values(d.produits || {}), recettes: Object.values(d.recettes || {}), events: Object.values(d.events || {}), membres: Object.values(d.membres || {}), sessions: Object.values(d.sessions || {}), clients: Object.values(d.clients || {}), achats: Object.values(d.achats || {}) }); }); }
        else { const push = () => cb({ produits: Object.values(this._local.get('produits')), recettes: Object.values(this._local.get('recettes')), events: Object.values(this._local.get('events')), membres: Object.values(this._local.get('membres')), sessions: Object.values(this._local.get('sessions')), clients: Object.values(this._local.get('clients')), achats: Object.values(this._local.get('achats')) }); push(); this._lp = push; }
      },
      _w(p, id, d) { if (fbReady) { firebase.database().ref(p + '/' + id).set(d); } else { const a = this._local.get(p); a[id] = d; this._local.set(p, a); this._lp && this._lp(); } },
      _r(p, id) { if (fbReady) { firebase.database().ref(p + '/' + id).remove(); } else { const a = this._local.get(p); delete a[id]; this._local.set(p, a); this._lp && this._lp(); } },
      getSetting(k, def) { return this._local.get('settings')[k] !== undefined ? this._local.get('settings')[k] : def; },
      setSetting(k, v) { const s = this._local.get('settings'); s[k] = v; this._local.set('settings', s); },

      addProduit(p) { p.id = this._id(); p.prix_ht = Math.round(p.prix_ht * 100) / 100; this._w('produits', p.id, p); },
      updateProduit(p) { p.prix_ht = Math.round(p.prix_ht * 100) / 100; this._w('produits', p.id, p); },
      deleteProduit(id) { this._r('produits', id); },

      addRecette(r) { r.id = this._id(); r.items = r.items || []; this._w('recettes', r.id, r); },
      updateRecette(r) { this._w('recettes', r.id, r); },
      deleteRecette(id) { this._r('recettes', id); },
      // Amélioration 5 — Protection circulaire
      hasCircularDep(candidateId, parentId, R, visited = new Set()) {
        if (visited.has(candidateId)) return false;
        visited.add(candidateId);
        const candidate = R.find(x => x.id === candidateId);
        if (!candidate) return false;
        return (candidate.items || []).some(i => {
          if (i.id_produit === parentId) return true;
          return this.hasCircularDep(i.id_produit, parentId, R, visited);
        });
      },
      addRecetteItem(rId, pId, q, u, R) {
        if (this.hasCircularDep(pId, rId, R)) return 'circular';
        const r = R.find(x => x.id === rId);
        if (r) { r.items = r.items || []; r.items.push({ id_produit: pId, quantite_base: parseFloat(q), unite_recette: u }); this._w('recettes', r.id, r); }
        return 'ok';
      },
      removeRecetteItem(rId, pId, R) { const r = R.find(x => x.id === rId); if (r) { r.items = (r.items || []).filter(i => i.id_produit !== pId); this._w('recettes', r.id, r); } },

      addEvent(e) { e.id = this._id(); e.recette_ids = e.recette_ids || []; e.membre_ids = e.membre_ids || []; e.statut = e.statut || 'prop_a_faire'; this._w('events', e.id, e); },
      updateEvent(e) { this._w('events', e.id, e); },
      deleteEvent(id) { this._r('events', id); },
      addEventRecette(eId, rId, E) { const ev = E.find(x => x.id === eId); if (ev) { ev.recette_ids = ev.recette_ids || []; if (!ev.recette_ids.includes(rId)) { ev.recette_ids.push(rId); } this._w('events', ev.id, ev); } },
      removeEventRecette(eId, rId, E) { const ev = E.find(x => x.id === eId); if (ev) { ev.recette_ids = (ev.recette_ids || []).filter(r => r !== rId); this._w('events', ev.id, ev); } },

      addMembre(m) { m.id = this._id(); this._w('membres', m.id, m); },
      updateMembre(m) { this._w('membres', m.id, m); },
      deleteMembre(id) { this._r('membres', id); },

      addClient(c) { c.id = this._id(); this._w('clients', c.id, c); },
      updateClient(c) { this._w('clients', c.id, c); },
      deleteClient(id) { this._r('clients', id); },

      addAchat(a) { a.id = this._id(); a.created_at = new Date().toISOString(); this._w('achats', a.id, a); },
      updateAchat(a) { this._w('achats', a.id, a); },
      deleteAchat(id) { this._r('achats', id); },
      getAchatsTTC(evId, achats) { return (achats || []).filter(a => a.event_id === evId).reduce((s, a) => s + (parseFloat(a.montant_ttc) || 0), 0); },

      addSession(s) { s.id = this._id(); s.todos = s.todos || []; s.membre_ids = s.membre_ids || []; this._w('sessions', s.id, s); },
      updateSession(s) { this._w('sessions', s.id, s); },
      deleteSession(id) { this._r('sessions', id); },
      addTodo(sId, text, S) { const s = S.find(x => x.id === sId); if (s) { s.todos = s.todos || []; s.todos.push({ id: this._id(), text, done: false }); this._w('sessions', s.id, s); } },
      toggleTodo(sId, tId, S) { const s = S.find(x => x.id === sId); if (s) { s.todos = (s.todos || []).map(t => t.id === tId ? { ...t, done: !t.done } : t); this._w('sessions', s.id, s); } },
      removeTodo(sId, tId, S) { const s = S.find(x => x.id === sId); if (s) { s.todos = (s.todos || []).filter(t => t.id !== tId); this._w('sessions', s.id, s); } },
      moveTodo(sId, tId, dir, S) {
        const s = S.find(x => x.id === sId);
        if (s && s.todos) {
          const idx = s.todos.findIndex(t => t.id === tId);
          if (idx !== -1) {
            const temp = s.todos[idx];
            if (dir === -1 && idx > 0) {
              s.todos[idx] = s.todos[idx - 1];
              s.todos[idx - 1] = temp;
            } else if (dir === 1 && idx < s.todos.length - 1) {
              s.todos[idx] = s.todos[idx + 1];
              s.todos[idx + 1] = temp;
            }
            this._w('sessions', s.id, s);
          }
        }
      },

      getRC(r, P, R) {
        // Mode simplifié : coût direct saisi manuellement
        if (r.cout_direct && parseFloat(r.cout_direct) > 0) return parseFloat(r.cout_direct);
        if (!r.items) return 0;
        return r.items.reduce((s, i) => {
          const p = P.find(x => x.id === i.id_produit);
          if (p) return s + (p.prix_ht * i.quantite_base);
          const subR = (R || []).find(x => x.id === i.id_produit && x.est_sous_recette);
          if (subR) return s + (this.getRC(subR, P, R) / (subR.base_pax || 1)) * i.quantite_base;
          return s;
        }, 0);
      },
      getEC(ev, R, P) { return (ev.recette_ids || []).reduce((s, rid) => { const r = R.find(x => x.id === rid); if (!r) return s; return s + this.getRC(r, P, R) * ((ev.pax || r.base_pax) / (r.base_pax || 1)); }, 0); },
      getFC(ev, R, P) { const cost = this.getEC(ev, R, P); const pvf = parseFloat(ev.prix_vente_final) || 0; return pvf > 0 ? (cost / pvf * 100) : 0; },
      getFCReel(ev, achats) { const cr = this.getAchatsTTC(ev.id, achats); const pvf = parseFloat(ev.prix_vente_final) || 0; return (cr > 0 && pvf > 0) ? (cr / pvf * 100) : 0; },
      getListe(eId, E, R, P) {
        const ev = E.find(x => x.id === eId); if (!ev) return []; const c = {};
        const addItems = (items, ratio) => {
          (items || []).forEach(i => {
            const p = P.find(x => x.id === i.id_produit);
            if (p) {
              if (!c[i.id_produit]) c[i.id_produit] = { produit: p, quantite: 0 };
              c[i.id_produit].quantite += i.quantite_base * ratio;
            } else {
              const subR = R.find(x => x.id === i.id_produit && x.est_sous_recette);
              if (subR) addItems(subR.items, ratio * (i.quantite_base / (subR.base_pax || 1)));
            }
          });
        };
        (ev.recette_ids || []).forEach(rid => {
          const r = R.find(x => x.id === rid); if (!r) return;
          addItems(r.items, (ev.pax || r.base_pax) / (r.base_pax || 1));
        });
        return Object.values(c).filter(x => x.produit).map(x => ({ ...x, quantite: Math.round(x.quantite * 100) / 100 }));
      },
      getListeMulti(eIds, E, R, P) {
        const c = {};
        eIds.forEach(eId => { const items = this.getListe(eId, E, R, P); items.forEach(item => { if (!c[item.produit.id]) { c[item.produit.id] = { produit: item.produit, quantite: 0 }; } c[item.produit.id].quantite += item.quantite; }); });
        return Object.values(c)
          .map(x => ({ ...x, quantite: Math.round(x.quantite * 100) / 100 }))
          .sort((a, b) => (a.produit.categorie || 'Z').localeCompare(b.produit.categorie || 'Z'));
      },
      getStats(d1, d2, E, R, P, A) {
        const evts = E.filter(ev => { if (!ev.date) return false; const d = new Date(ev.date); return (!d1 || d >= new Date(d1)) && (!d2 || d <= new Date(d2)); });
        let ca = 0, cout = 0, coutReel = 0, nbR = new Set(), paxTotal = 0, nbAvecReel = 0;
        evts.forEach(ev => { const cost = this.getEC(ev, R, P); cout += cost; ca += parseFloat(ev.prix_vente_final) || 0; paxTotal += parseInt(ev.pax) || 0; const cr = this.getAchatsTTC(ev.id, A); if (cr > 0) { coutReel += cr; nbAvecReel++; } (ev.recette_ids || []).forEach(r => nbR.add(r)); });
        const fc = ca > 0 ? (cout / ca * 100) : 0; const fcReel = (coutReel > 0 && ca > 0) ? (coutReel / ca * 100) : 0; const marge = Math.round((ca - cout) * 100) / 100; const margeReelle = coutReel > 0 ? Math.round((ca - coutReel) * 100) / 100 : null;
        return { caTotal: Math.round(ca * 100) / 100, coutTotal: Math.round(cout * 100) / 100, coutReelTotal: Math.round(coutReel * 100) / 100, fc: Math.round(fc * 10) / 10, fcReel: Math.round(fcReel * 10) / 10, nbRecettes: nbR.size, nbEvents: evts.length, paxTotal, margeTotal: marge, margeReelle, nbAvecReel };
      },
      getParticipation(M, S, E) {
        return M.map(m => {
          const sessCount = S.filter(s => (s.membre_ids || []).includes(m.id)).length;
          const evCount = E.filter(ev => (ev.membre_ids || []).includes(m.id)).length;
          return { ...m, sessCount, evCount, total: sessCount + evCount };
        }).sort((a, b) => b.total - a.total);
      }
    };

    // ═══════════════════════════════════════════════════
    // CALENDAR UTILITIES
    // ═══════════════════════════════════════════════════
    function padZ(n) { return String(n).padStart(2, '0'); }
    function toICSDate(dateStr, timeStr) {
      const d = new Date(dateStr);
      if (timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return d.getFullYear() + padZ(d.getMonth() + 1) + padZ(d.getDate()) + 'T' + padZ(h) + padZ(m) + '00';
      }
      return d.getFullYear() + padZ(d.getMonth() + 1) + padZ(d.getDate());
    }
    function toGoogleDate(dateStr, timeStr) {
      const d = new Date(dateStr);
      if (timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return d.getFullYear() + padZ(d.getMonth() + 1) + padZ(d.getDate()) + 'T' + padZ(h) + padZ(m) + '00';
      }
      return d.getFullYear() + padZ(d.getMonth() + 1) + padZ(d.getDate());
    }
    function generateICS(opts) {
      const uid = Date.now() + '@imhi-traiteur';
      const now = new Date(); const stamp = now.getFullYear() + padZ(now.getMonth() + 1) + padZ(now.getDate()) + 'T' + padZ(now.getHours()) + padZ(now.getMinutes()) + padZ(now.getSeconds());
      let lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//IMHI Traiteur//Calendar//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + stamp];
      if (opts.heure_debut) {
        lines.push('DTSTART:' + toICSDate(opts.date, opts.heure_debut));
        lines.push('DTEND:' + toICSDate(opts.date, opts.heure_fin || opts.heure_debut));
      } else {
        lines.push('DTSTART;VALUE=DATE:' + toICSDate(opts.date));
        const next = new Date(opts.date); next.setDate(next.getDate() + 1);
        lines.push('DTEND;VALUE=DATE:' + next.getFullYear() + padZ(next.getMonth() + 1) + padZ(next.getDate()));
      }
      lines.push('SUMMARY:' + opts.title);
      if (opts.location) lines.push('LOCATION:' + opts.location);
      if (opts.description) lines.push('DESCRIPTION:' + opts.description.replace(/\n/g, '\\n'));
      lines.push('END:VEVENT', 'END:VCALENDAR');
      return lines.join('\r\n');
    }
    function downloadICS(opts) {
      const content = generateICS(opts);
      const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

    function buildGoogleCalURL(opts) {
      const base = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
      let dates;
      if (opts.heure_debut) {
        dates = toGoogleDate(opts.date, opts.heure_debut) + '/' + toGoogleDate(opts.date, opts.heure_fin || opts.heure_debut);
      } else {
        dates = toGoogleDate(opts.date) + '/' + toGoogleDate(opts.date);
      }
      const params = ['text=' + encodeURIComponent(opts.title), 'dates=' + dates];
      if (opts.location) params.push('location=' + encodeURIComponent(opts.location));
      if (opts.description) params.push('details=' + encodeURIComponent(opts.description));
      return base + '&' + params.join('&');

    function getRSVPReminders(events, sessions) {
      const today = new Date(); today.setHours(0,0,0,0);
      const DAYS = [14, 7, 5];
      const results = [];
      const check = (items, type) => {
        items.forEach(item => {
          if (!item.date || !item.membre_ids || !item.membre_ids.length) return;
          const d = new Date(item.date); d.setHours(0,0,0,0);
          const diffDays = Math.round((d - today) / 86400000);
          if (DAYS.includes(diffDays)) {
            results.push({ item, type, diffDays });
          }
        });
      };
      check(events || [], 'event');
      check(sessions || [], 'session');
      return results;
    }

          prix_achat_ttc: ttc,
          tva: tvaTaux,
          prix_ht: prixUnitaireHT, // Price per unit for getRC compatibility
          unite: form.u_contenu_u, // The unit used in recipes
          quantite: qContenu,     // Legacy compatibility
          conditionnement: form.u_achat_nom, // Legacy compatibility
          u_contenu_q: qContenu
        };
        
        if (edit) { 
          DB.updateProduit({ ...d, id: edit.id }); 
          toast('Modifié', 'success'); 
          if (detail?.id === edit.id) setDetail({ ...d, id: edit.id }); 
        } else { 
          DB.addProduit(d);

    // ═══════ TAB 4 — STATS ═══════
    function StatsTab({ toast, events, recettes, produits, membres, sessions, achats }) {
      const [d1, setD1] = useState(''); const [d2, setD2] = useState('');
      const [partFilter, setPartFilter] = useState('total');
      const [sortCol, setSortCol] = useState('date');
      const [sortDir, setSortDir] = useState(-1);
      const [showAll, setShowAll] = useState(false);

      const stats = DB.getStats(d1, d2, events, recettes, produits, achats);
      const participation = DB.getParticipation(membres || [], sessions || [], events);
      const maxPart = Math.max(1, ...participation.map(m => partFilter === 'sessCount' ? m.sessCount : partFilter === 'evCount' ? m.evCount : m.total));

      const filteredEvents = events.filter(ev => {
        if (!showAll && !ev.date) return false;
        if (!ev.date) return showAll;
        const d = new Date(ev.date);
        return (!d1 || d >= new Date(d1)) && (!d2 || d <= new Date(d2));
      });

      const tableData = filteredEvents.map(ev => {
        const ca = parseFloat(ev.prix_vente_final) || 0;
        const cout = DB.getAchatsTTC(ev.id, achats);
        const marge = cout > 0 ? (ca - cout) : null;
        const fc = cout > 0 && ca > 0 ? (cout / ca * 100) : null;
        return { id: ev.id, nom: ev.nom || 'Sans nom', date: ev.date || '', ca, cout, marge, fc };
      }).sort((a, b) => {
        let vA = a[sortCol]; let vB = b[sortCol];
        if (vA === null || vA === '') vA = sortDir === 1 ? 'zzzz' : '';
        if (vB === null || vB === '') vB = sortDir === 1 ? 'zzzz' : '';
        if (typeof vA === 'string') return sortDir * vA.localeCompare(vB);
        return sortDir * (vA - vB);
      });

      return html`<div class="pb-20">
        <div class="glass glow rounded-2xl p-4 mb-4 max-w-xl">
          <h3 class="text-sm font-semibold text-secondary mb-3 flex items-center gap-2"><span class="material-icons-round text-lg text-primary-light">calendar_today</span> Filtre par période</h3>
          <div class="grid grid-cols-2 gap-3">
            <${Field} label="Date début" type="date" value=${d1} onInput=${e => setD1(e.target.value)} />
            <${Field} label="Date fin" type="date" value=${d2} onInput=${e => setD2(e.target.value)} />
          </div>
          <div class="flex justify-end mt-2">
            <button class="text-[10px] text-muted hover:text-primary-light transition-colors" onClick=${() => { setD1(''); setD2(''); }}>Réinitialiser le filtre</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <${KPI} icon="payments" label="CA Total" value="${stats.caTotal.toFixed(0)}€" color="from-primary to-primary-light" delay="0ms" />
          <${KPI} icon="trending_up" label="Marge Totale" value="${stats.margeTotal.toFixed(0)}€" color=${stats.margeTotal >= 0 ? 'from-emerald-600 to-emerald-800' : 'from-red-600 to-red-800'} delay="60ms" />
          <${KPI} icon="groups" label="Clients servis" value="${stats.paxTotal}" color="from-violet-600 to-violet-800" delay="120ms" />
          <${KPI} icon="event" label="Événements" value="${stats.nbEvents}" color="from-cyan-600 to-cyan-800" delay="180ms" />
        </div>

        <div class="glass glow rounded-2xl p-5 mb-4 overflow-x-auto">
          <h3 class="text-sm font-semibold text-secondary mb-3 flex items-center justify-between">
            <div class="flex items-center gap-2"><span class="material-icons-round text-lg text-emerald-400">table_chart</span> Analyse Food Cost par événement</div>
            <button class="flex items-center gap-1 text-[10px] px-2 py-1 rounded-lg ${showAll ? 'bg-primary/20 text-primary-light border border-primary/30' : 'bg-white/5 border border-white/10 text-muted'} hover:opacity-80 transition-all" onClick=${() => setShowAll(!showAll)}>
              <span class="material-icons-round text-[12px]">${showAll ? 'filter_list_off' : 'filter_list'}</span>
              ${showAll ? 'Avec date seulement' : 'Voir tous les événements'}
            </button>
          </h3>
          <table class="w-full text-left text-xs text-secondary whitespace-nowrap">
            <thead>
              <tr class="border-b border-white/10 uppercase tracking-wider text-muted text-[10px]">
                ${[ { id: 'date', label: 'Date' }, { id: 'nom', label: 'Événement' }, { id: 'ca', label: 'CA' }, { id: 'cout', label: 'Coût Achats' }, { id: 'marge', label: 'Marge (€)' }, { id: 'fc', label: 'FC (%)' } ].map(col => html`<th key=${col.id} class="p-2 font-medium cursor-pointer hover:text-primary-light transition-colors" onClick=${() => { setSortDir(sortCol === col.id ? -sortDir : -1); setSortCol(col.id); }}>
                  <div class="flex items-center gap-1">${col.label} ${sortCol === col.id ? html`<span class="material-icons-round text-[10px]">${sortDir === 1 ? 'arrow_upward' : 'arrow_downward'}</span>` : ''}</div>
                </th>`)}
              </tr>
            </thead>
            <tbody>
              ${tableData.length === 0 ? html`<tr><td colSpan="6" class="p-4 text-center text-dimmed italic text-[11px]">Aucun événement pour cette période</td></tr>` : 
                tableData.map(row => html`<tr key=${row.id} class="border-b border-white/5 hover:bg-white/5 transition-colors">
                  <td class="p-2 text-muted whitespace-nowrap">${row.date ? new Date(row.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: '2-digit' }) : html`<span class="italic text-dimmed">—</span>`}</td>
                  <td class="p-2 font-medium text-secondary truncate max-w-[150px] md:max-w-xs" title=${row.nom}>${row.nom}</td>
                  <td class="p-2">${row.ca.toFixed(2)}€</td>
                  <td class="p-2">${row.cout > 0 ? row.cout.toFixed(2) + '€' : html`<span class="text-muted italic">—</span>`}</td>
                  <td class="p-2 ${row.marge !== null ? (row.marge >= 0 ? 'text-emerald-400' : 'text-red-400') : ''}">${row.marge !== null ? row.marge.toFixed(2) + '€' : html`<span class="text-muted italic">—</span>`}</td>
                  <td class="p-2 font-bold ${row.fc !== null ? (row.fc <= 30 ? 'text-emerald-400' : row.fc <= 40 ? 'text-amber-400' : 'text-red-400') : ''}">${row.fc !== null ? row.fc.toFixed(1) + '%' : html`<span class="text-muted italic">—</span>`}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>

        <div class="glass glow rounded-2xl p-5 mb-4">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <h3 class="text-sm font-semibold text-secondary flex items-center gap-2"><span class="material-icons-round text-lg text-violet-400">people</span> Participation Membres</h3>
            <div class="flex gap-2 overflow-x-auto scrollbar-hide">
              ${[{ id: 'total', label: 'Cumul' }, { id: 'sessCount', label: 'Sessions' }, { id: 'evCount', label: 'Événements' }].map(f => html`<button key=${f.id} class="shrink-0 px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all ${partFilter === f.id ? 'bg-violet-500/25 text-violet-300 border border-violet-500/30' : 'bg-white/5 text-muted border border-transparent hover:bg-violet-500/10'}" onClick=${() => setPartFilter(f.id)}>${f.label}</button>`)}
            </div>
          </div>
          ${participation.length > 0 ? html`<div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-6">
            ${participation.map((m, i) => {
              const val = partFilter === 'sessCount' ? m.sessCount : partFilter === 'evCount' ? m.evCount : m.total; 
              const pct = maxPart > 0 ? Math.round(val / maxPart * 100) : 0;
              const pctEv = maxPart > 0 ? Math.round(m.evCount / maxPart * 100) : 0;
              const pctSe = maxPart > 0 ? Math.round(m.sessCount / maxPart * 100) : 0;
              return html`<div key=${m.id} class="flex items-center gap-4 animate-cardIn" style=${{ animationDelay: i * 40 + 'ms' }}>
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-primary to-primary-light flex items-center justify-center text-white font-black text-base shadow-lg shrink-0">${(m.prenom || '?')[0].toUpperCase()}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-bold text-secondary truncate">${m.prenom}</span>
                    <span class="text-xs font-black flex items-center gap-1.5">
                      ${partFilter === 'total' ? html`
                        <span class="text-emerald-400" title="Événements">${m.evCount}</span>
                        <span class="text-white/20 text-[10px]">+</span>
                        <span class="text-amber-400" title="Sessions">${m.sessCount}</span>
                        <span class="text-white/20 text-[10px]">=</span>
                        <span class="text-violet-300 font-black">${val}</span>
                      ` : html`<span class="${val > 0 ? 'text-violet-300' : 'text-dimmed'}">${val}</span>`}
                    </span>
                  </div>
                  <div class="h-2 bg-white/5 rounded-full overflow-hidden border border-white/5 flex gap-0.5">
                    ${partFilter === 'total' ? html`
                      <div class="h-full bg-gradient-to-r from-emerald-500 to-emerald-400 transition-all duration-700 ease-out ${pctEv === 100 ? 'rounded-full' : pctEv > 0 ? 'rounded-l-full' : ''}" style=${{ width: pctEv + '%' }}></div>
                      <div class="h-full bg-gradient-to-r from-amber-500 to-amber-400 transition-all duration-700 ease-out ${pctSe === 100 ? 'rounded-full' : pctSe > 0 ? 'rounded-r-full' : ''}" style=${{ width: pctSe + '%' }}></div>
                    ` : html`
                      <div class="h-full bg-gradient-to-r from-violet-600 to-violet-400 rounded-full transition-all duration-700 ease-out" style=${{ width: pct + '%' }}></div>
                    `}
                  </div>
                </div>
              </div>`;
            })}
          </div>` : html`<div class="text-center py-10 text-dimmed text-sm italic">Aucun membre enregistré</div>`}
        </div>
      </div>`;
    }

    // ═══════ CALENDRIER TAB ═══════
    function CalendrierTab({ toast, events, sessions, membres, onBack }) {
      const [cur, setCur] = useState(() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; });
      const [selDate, setSelDate] = useState(null);
      const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const firstDow = (y, m) => { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; };
      const months = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
      const dayNames = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
      const prev = () => setCur(c => c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 });
      const next = () => setCur(c => c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 });
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const fmt = d => { const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0'); return y + '-' + m + '-' + dd; };
      const dateMap = {};
      events.forEach(ev => { if (ev.date) { if (!dateMap[ev.date]) dateMap[ev.date] = { events: [], sessions: [] }; dateMap[ev.date].events.push(ev); } });
      sessions.forEach(s => { if (s.date) { if (!dateMap[s.date]) dateMap[s.date] = { events: [], sessions: [] }; dateMap[s.date].sessions.push(s); } });
      const dim = daysInMonth(cur.y, cur.m);
      const fdow = firstDow(cur.y, cur.m);
      const cells = [];
      for (let i = 0; i < fdow; i++)cells.push(null);
      for (let d = 1; d <= dim; d++)cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      const detailPane = selDate ? html`<div class="animate-fadeIn">
          <button onClick=${() => setSelDate(null)} class="flex items-center gap-1 text-primary-light text-sm mb-6 md:hidden"><span class="material-icons-round text-lg">arrow_back</span> Retour</button>
          
          <div class="glass glow rounded-[2rem] p-6 mb-6">
            <div class="text-center mb-6">
              <div class="text-xs font-bold text-primary-light uppercase tracking-[0.2em] mb-2">${new Date(selDate).toLocaleDateString('fr-FR', { weekday: 'long' })}</div>
              <div class="text-5xl font-black text-secondary tracking-tight mb-2">${new Date(selDate).getDate()}</div>
              <div class="text-sm font-medium text-dimmed uppercase tracking-wider">${new Date(selDate).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</div>
            </div>
            
            <div class="space-y-6">
              ${(() => {
                const items = dateMap[selDate] || { events: [], sessions: [] };
                if (items.events.length === 0 && items.sessions.length === 0) {
                  return html`<div class="text-center py-12 border-2 border-dashed border-white/5 rounded-3xl">
                    <span class="material-icons-round text-5xl text-white/10 mb-3 block">event_busy</span>
                    <p class="text-dimmed font-medium">Rien de prévu ce jour</p>
                  </div>`;
                }
                return html`
                  ${items.events.length > 0 && html`<div>
                    <h3 class="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]"></span> Événements</h3>
                    <div class="space-y-3">
                      ${items.events.map(ev => html`<div key=${ev.id} class="glass rounded-2xl p-4 border border-emerald-500/10 hover:bg-emerald-500/5 transition-colors">
                        <div class="font-bold text-secondary text-base mb-1">${ev.nom}</div>
                        <div class="flex flex-wrap items-center gap-3 text-xs text-muted">
                          ${ev.heure_debut && html`<span class="flex items-center gap-1.5"><span class="material-icons-round text-[14px] text-emerald-400/70">schedule</span>${ev.heure_debut}${ev.heure_fin ? ' - ' + ev.heure_fin : ''}</span>`}
                          ${ev.lieu && html`<span class="flex items-center gap-1.5"><span class="material-icons-round text-[14px] text-emerald-400/70">place</span>${ev.lieu}</span>`}
                          ${ev.pax && html`<span class="flex items-center gap-1.5"><span class="material-icons-round text-[14px] text-emerald-400/70">group</span>${ev.pax} pax</span>`}
                        </div>
                      </div>`)}
                    </div>
                  </div>`}
                  
                  ${items.sessions.length > 0 && html`<div>
                    <h3 class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.5)]"></span> Cooking Sessions</h3>
                    <div class="space-y-3">
                      ${items.sessions.map(s => {
                        const ev = events.find(e => e.id === s.event_id);
                        return html`<div key=${s.id} class="glass rounded-2xl p-4 border border-amber-500/10 hover:bg-amber-500/5 transition-colors">
                          <div class="font-bold text-secondary text-base mb-1">${s.nom}</div>
                          <div class="flex flex-wrap items-center gap-3 text-xs text-muted">
                            ${s.heure_debut && html`<span class="flex items-center gap-1.5"><span class="material-icons-round text-[14px] text-amber-400/70">schedule</span>${s.heure_debut}${s.heure_fin ? ' - ' + s.heure_fin : ''}</span>`}
                            ${ev && html`<span class="flex items-center gap-1.5"><span class="material-icons-round text-[14px] text-amber-400/70">event</span>${ev.nom}</span>`}
                          </div>
                        </div>`
                      })}
                    </div>
                  </div>`}
                `;
              })()}
            </div>
          </div>
        </div>` : null;

      const listPane = html`<div>
          <div class="hidden md:flex items-center justify-between mb-8">
            <div>
              <h1 class="text-3xl font-black text-secondary tracking-tight">Calendrier</h1>
              <p class="text-xs text-dimmed uppercase tracking-widest font-bold mt-1">Vue mensuelle & planning</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-500 to-rose-700 flex items-center justify-center text-white shadow-xl shadow-rose-500/20">
              <span class="material-icons-round text-2xl">calendar_month</span>
            </div>
          </div>

          <button onClick=${onBack} class="flex items-center gap-1 text-primary-light text-sm mb-6 md:hidden"><span class="material-icons-round text-lg">arrow_back</span> Retour</button>

          <div class="glass glow rounded-[2rem] p-6 mb-6">
            <div class="flex items-center justify-between mb-8 px-2">
              <button onClick=${prev} class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center hover:bg-primary/20 transition-all active:scale-95"><span class="material-icons-round text-secondary">chevron_left</span></button>
              <div class="text-center">
                <div class="text-2xl font-black text-secondary tracking-tight">${months[cur.m]}</div>
                <div class="text-xs font-bold text-dimmed uppercase tracking-widest">${cur.y}</div>
              </div>
              <button onClick=${next} class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center hover:bg-primary/20 transition-all active:scale-95"><span class="material-icons-round text-secondary">chevron_right</span></button>
            </div>
            
            <div class="grid grid-cols-7 gap-1 mb-2">
              ${dayNames.map(d => html`<div key=${d} class="text-center text-[10px] font-black text-dimmed uppercase tracking-widest py-2">${d}</div>`)}
            </div>
            
            <div class="grid grid-cols-7 gap-1">
              ${cells.map((day, i) => {
                if (day === null) return html`<div key=${'e' + i} class="aspect-square"></div>`;
                const dateStr = fmt(new Date(cur.y, cur.m, day));
                const info = dateMap[dateStr];
                const isToday = cur.y === today.getFullYear() && cur.m === today.getMonth() && day === today.getDate();
                const isSelected = selDate === dateStr;
                const hasEv = info && info.events.length > 0;
                const hasSe = info && info.sessions.length > 0;
                
                return html`<button key=${day} class="aspect-square flex flex-col items-center justify-center rounded-2xl transition-all relative overflow-hidden active:scale-90 ${isSelected ? 'bg-primary text-white shadow-lg shadow-primary/30 z-10' : isToday ? 'bg-primary/15 border-2 border-primary/40 text-primary-light' : 'hover:bg-white/5 text-secondary'}" onClick=${() => setSelDate(dateStr)}>
                  <span class="text-sm font-bold relative z-10">${day}</span>
                  <div class="flex gap-1 mt-1.5 relative z-10">
                    ${hasEv && html`<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_4px_rgba(52,211,153,0.5)]"></span>`}
                    ${hasSe && html`<span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_4px_rgba(251,191,36,0.5)]"></span>`}
                  </div>
                </button>`;
              })}
            </div>
          </div>

          <div class="flex items-center gap-6 px-4 py-3 bg-white/5 rounded-2xl justify-center text-[10px] font-bold uppercase tracking-widest text-dimmed border border-white/5">
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span> Événements</span>
            <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.4)]"></span> Sessions</span>
          </div>
        </div>`;

      return html`<div class="md:grid md:grid-cols-12 md:gap-8 md:items-start md:h-[calc(100vh-140px)]">
        <div class="md:col-span-7 lg:col-span-7 ${selDate ? 'hidden md:block' : ''} md:h-full md:overflow-y-auto scrollbar-hide md:pr-4">
          ${listPane}
        </div>
        ${selDate ? html`<div class="md:col-span-5 lg:col-span-5 md:h-full md:overflow-y-auto scrollbar-hide">
          ${detailPane}
        </div>` : html`<div class="hidden md:flex flex-col md:col-span-5 lg:col-span-5 items-center justify-center h-full text-dimmed border-2 border-dashed border-white/10 rounded-[2rem] bg-white/5 min-h-[400px]">
          <span class="material-icons-round text-5xl text-white/10 mb-4 block">event_note</span>
          <p class="text-base font-bold text-white/40 uppercase tracking-widest">Détails du jour</p>
          <p class="text-[10px] text-white/20 mt-2 font-medium">SÉLECTIONNEZ UNE DATE POUR VOIR L'ACTIVITÉ</p>
        </div>`}
      </div>`;
    }

    // ═══════ DRAWER ═══════
    function Drawer({ open, onClose, onNav }) {
      if (!open) return null;
      const items = [{ id: 'membres', icon: 'people', label: 'Membres', desc: 'Gestion de l\'équipe' }, { id: 'clients', icon: 'contacts', label: 'Clients', desc: 'Gestion CRM' }, { id: 'sessions', icon: 'schedule', label: 'Cooking Sessions', desc: 'Préparation & to-do' }, { id: 'calendrier', icon: 'calendar_month', label: 'Calendrier', desc: 'Vue mensuelle' }, { id: 'settings', icon: 'settings', label: 'Paramètres', desc: 'Sécurité & Options' }];
      return html`<div class="fixed inset-0 z-[60]" onClick=${e => { if (e.target === e.currentTarget) onClose() }}>
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm animate-fadeIn"></div>
    <div class="absolute left-0 top-0 bottom-0 w-72 glass-strong border-r border-primary/15 flex flex-col" style=${{ animation: 'slideRight 0.3s ease-out' }} onClick=${e => e.stopPropagation()}>
      <div class="p-5 border-b border-primary/10">
        <div class="flex items-center gap-3 mb-1"><div class="w-9 h-9 rounded-xl bg-primary/30 flex items-center justify-center"><span class="material-icons-round text-primary-light">restaurant</span></div>
          <div><div class="text-base font-bold gradient-text">IMHI Traiteur</div><div class="text-[10px] text-dimmed">Menu</div></div></div></div>
      <div class="flex-1 p-3 space-y-1">${items.map(it => html`<button key=${it.id} class="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 hover:bg-primary/15 transition-all text-left" onClick=${() => { onNav(it.id); onClose(); }}>
        <span class="material-icons-round text-primary-light">${it.icon}</span>
        <div><div class="text-sm font-medium text-secondary">${it.label}</div><div class="text-[10px] text-dimmed">${it.desc}</div></div></button>`)}</div>
      <div class="p-4 border-t border-primary/10">
        <div class="mb-4 text-center">
          <div class="text-[10px] text-dimmed leading-relaxed">Créé, designé et développé par<br/><span class="font-bold text-primary-light/90">Pierre Clausse</span> © 2026</div>
        </div>
        <button onClick=${onClose} class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-muted transition-all text-sm"><span class="material-icons-round text-sm">close</span> Fermer</button>
      </div>
    </div></div>`;
    }

    // ═══════ MEMBRES TAB ═══════
    function MembresTab({ toast, membres, events, sessions, onBack }) {
      const [showForm, setShowForm] = useState(false);
      const [edit, setEdit] = useState(null);
      const [search, setSearch] = useState('');
      const [memberToDelete, setMemberToDelete] = useState(null);
      const ROLES = ['Board', 'Opérations', 'RH', 'Philanthropie', 'Marketing & Com', 'Finance', 'Développement'];
      const [form, setForm] = useState({ prenom: '', email: '', role: '' });
      const [detail, setDetail] = useState(null);
      const filtered = membres.filter(m => (m.prenom || '').toLowerCase().includes(search.toLowerCase()) || (m.email || '').toLowerCase().includes(search.toLowerCase()) || (m.role || '').toLowerCase().includes(search.toLowerCase()));
      const save = () => {
        if (!form.prenom) return toast('Prénom requis', 'error');
        if (!form.email) return toast('Email requis', 'error');
        if (!form.role) return toast('Rôle requis', 'error');
        if (edit) { DB.updateMembre({ ...edit, ...form }); toast('Membre modifié', 'success'); }
        else { DB.addMembre({ ...form }); toast('Membre ajouté !', 'success'); }
        setForm({ prenom: '', email: '', role: '' }); setShowForm(false); setEdit(null);
      };
      const startEdit = (m) => { setForm({ prenom: m.prenom, email: m.email || '', role: m.role || '' }); setEdit(m); setShowForm(true); };
      const closeForm = () => { setShowForm(false); setEdit(null); setForm({ prenom: '', email: '', role: '' }); };
      const executeDelMembre = () => { if (!memberToDelete) return; DB.deleteMembre(memberToDelete); setMemberToDelete(null); setDetail(null); toast('Membre supprimé', 'success'); };

      const [csvModal, setCsvModal] = useState(false);
      const [csvRows, setCsvRows] = useState([]);

      const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
      const toTitleCase = s => s ? s.split(/[\s-]/).map(w => capitalize(w)).join(s.includes('-') ? '-' : ' ') : '';

      const parseCSV = (text) => {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) return { error: 'Fichier vide ou format invalide.', rows: [] };
        const sep = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].split(sep).map(h => h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
        const find = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));
        const iPre = find(['prenom', 'first', 'firstname', 'prénom']);
        const iNom = find(['nom', 'last', 'lastname', 'name']);
        const iMail = find(['mail', 'email', 'courriel']);
        const iB00 = find(['b00', 'b0', 'identifiant', 'login', 'id']);
        const iDept = find(['departement', 'dept', 'pole', 'département', 'role']);
        const iClasse = find(['classe', 'promo', 'annee', 'année']);
        if (iPre === -1 && iNom === -1 && iB00 === -1) return { error: 'Colonnes Prénom, Nom ou B00 introuvables.', rows: [] };
        const rows = lines.slice(1).map(line => {
          const cols = line.split(sep).map(c => c.trim().replace(/^["']|["']$/g, ''));
          // Nom formaté : "Prénom NOM" → on capitalise le prénom et met le nom en majuscules courtes
          const prenomRaw = iPre !== -1 ? cols[iPre] : '';
          const nomRaw = iNom !== -1 ? cols[iNom] : '';
          const prenomFmt = toTitleCase(prenomRaw);
          const nomFmt = nomRaw ? nomRaw.toUpperCase() : '';
          const prenom = [prenomFmt, nomFmt].filter(Boolean).join(' ');
          // Email : priorité colonne email, sinon construction depuis B00
          const b00Raw = iB00 !== -1 ? cols[iB00] : '';
          const emailCol = iMail !== -1 ? cols[iMail] : '';
          const email = emailCol || (b00Raw ? b00Raw.toLowerCase() + '@essec.edu' : '');
          const dept = iDept !== -1 ? cols[iDept] : '';
          const classe = iClasse !== -1 ? cols[iClasse] : '';
          return { prenom, email, departement: dept, classe, b00: b00Raw };
        }).filter(r => r.prenom || r.email);
        return { error: '', rows };
      };

      const handleCSVImport = (e) => {
        const file = e.target.files?.[0]; if (!file) return; e.target.value = '';
        const reader = new FileReader();
        reader.onload = (ev) => {
          const { error, rows } = parseCSV(ev.target.result);
          if (error) { toast('CSV : ' + error, 'error'); return; }
          setCsvRows(rows); setCsvModal(true);
        };
        reader.readAsText(file, 'UTF-8');
      };

      const confirmCSVImport = () => {
        const existing = membres.map(m => (m.email || '').toLowerCase()).filter(Boolean);
        let added = 0, skipped = 0;
        csvRows.forEach(row => {
          if (row.email && existing.includes(row.email.toLowerCase())) { skipped++; return; }
          DB.addMembre({ prenom: row.prenom, email: row.email, role: row.departement || row.classe || '' });
          added++;
        });
        toast(`${added} membre(s) importé(s)${skipped > 0 ? ', ' + skipped + ' doublon(s) ignoré(s)' : ''}.`, 'success');
        setCsvModal(false); setCsvRows([]);
      };

      const detailPane = detail ? html`<div class="animate-fadeIn pb-20 md:pb-0">
        <div class="flex items-center justify-between mb-4">
          <button onClick=${() => setDetail(null)} class="flex items-center gap-1 text-primary-light text-sm"><span class="material-icons-round text-lg">arrow_back</span> Retour</button>
          <div class="flex gap-2">
            <button onClick=${() => startEdit(detail)} class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-primary/20 text-primary-light text-sm"><span class="material-icons-round text-sm">edit</span> Modifier</button>
            <button onClick=${() => setMemberToDelete(detail.id)} class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-red-500/10 text-red-400 text-sm"><span class="material-icons-round text-sm">delete</span></button>
          </div>
        </div>

        <div class="glass glow rounded-2xl p-6 mb-6">
          <div class="flex items-center gap-5 mb-6">
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-violet-500 to-violet-700 flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-violet-500/20 shrink-0">${(detail.prenom || '?')[0].toUpperCase()}</div>
            <div>
              <h2 class="text-2xl font-black text-secondary tracking-tight">${detail.prenom}</h2>
              <div class="text-sm font-bold text-primary-light uppercase tracking-widest mt-1">${detail.role || 'Membre'}</div>
            </div>
          </div>
          <div class="flex flex-col gap-3">
            <div class="flex items-center gap-3 p-4 bg-white/5 rounded-2xl border border-white/5 text-sm text-secondary"><span class="material-icons-round text-[18px] text-primary-light">email</span>${detail.email || 'Aucun email'}</div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="glass glow rounded-2xl p-5">
            <h3 class="text-xs font-black text-secondary uppercase tracking-widest mb-4 flex items-center gap-2"><span class="material-icons-round text-sm text-emerald-400">event</span> Événements rattachés</h3>
            ${(() => {
              const matched = events.filter(e => (e.membre_ids || []).includes(detail.id)).sort((a,b) => (b.date||'').localeCompare(a.date||''));
              return matched.length === 0 ? html`<div class="text-center py-10 text-dimmed text-xs border border-dashed border-white/10 rounded-2xl">Aucun événement assigné</div>` :
              html`<div class="space-y-2">${matched.map(ev => html`<div key=${ev.id} class="p-3 bg-white/5 rounded-xl text-xs border border-white/5 flex justify-between items-center"><div class="font-bold text-secondary truncate">${ev.nom}</div><div class="text-muted shrink-0">${ev.date ? new Date(ev.date).toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) : ''}</div></div>`)}</div>`;
            })()}
          </div>
          <div class="glass glow rounded-2xl p-5">
            <h3 class="text-xs font-black text-secondary uppercase tracking-widest mb-4 flex items-center gap-2"><span class="material-icons-round text-sm text-orange-400">schedule</span> Cooking Sessions</h3>
            ${(() => {
              const matched = sessions.filter(s => (s.membre_ids || []).includes(detail.id)).sort((a,b) => (b.date||'').localeCompare(a.date||''));
              return matched.length === 0 ? html`<div class="text-center py-10 text-dimmed text-xs border border-dashed border-white/10 rounded-2xl">Aucune session assignée</div>` :
              html`<div class="space-y-2">${matched.map(s => html`<div key=${s.id} class="p-3 bg-white/5 rounded-xl text-xs border border-white/5 flex justify-between items-center"><div class="font-bold text-secondary truncate">${s.nom}</div><div class="text-muted shrink-0">${s.date ? new Date(s.date).toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) : ''}</div></div>`)}</div>`;
            })()}
          </div>
        </div>
      </div>` : null;

      const listPane = html`<div class="pb-20 md:pb-0">
        <div class="hidden md:flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-black text-secondary">Membres</h1><p class="text-xs text-dimmed">L'équipe IMHI Traiteur</p></div>
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-violet-700 flex items-center justify-center text-white shadow-lg shadow-violet-500/20"><span class="material-icons-round">people</span></div>
        </div>
        <button onClick=${onBack} class="flex items-center gap-1 text-primary-light text-sm mb-4 md:hidden"><span class="material-icons-round text-lg">arrow_back</span> Retour</button>
        <div class="relative mb-4">
          <span class="material-icons-round absolute left-3 top-1/2 -translate-y-1/2 text-dimmed text-lg">search</span>
          <input class="w-full !pl-10" placeholder="Rechercher un membre..." value=${search} onInput=${e => setSearch(e.target.value)} />
        </div>
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs text-muted">${filtered.length} membre(s)</span>
          <label class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-violet-500/10 border border-violet-500/20 text-violet-300 text-[11px] font-bold cursor-pointer hover:bg-violet-500/20 transition-colors">
            <span class="material-icons-round text-sm">upload_file</span> Importer CSV
            <input type="file" accept=".csv,.txt" class="hidden" onChange=${handleCSVImport} />
          </label>
        </div>
        <div class="space-y-3">
          ${filtered.map((m, i) => {
            const sel = detail?.id === m.id;
            const evCount = events.filter(e => (e.membre_ids || []).includes(m.id)).length;
            const sessCount = sessions.filter(s => (s.membre_ids || []).includes(m.id)).length;
            return html`<div key=${m.id} class="glass glow rounded-2xl p-4 flex items-center gap-4 cursor-pointer active:scale-[0.98] transition-all animate-cardIn ${sel ? 'ring-2 ring-primary border-transparent shadow-lg shadow-primary/10' : 'hover:bg-white/5'}" style=${{ animationDelay: i * 50 + 'ms' }} onClick=${() => setDetail(m)}>
              <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-primary-light flex items-center justify-center text-white font-black text-xl shadow-sm shrink-0">${(m.prenom || '?')[0].toUpperCase()}</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <div class="font-bold text-secondary text-base truncate">${m.prenom}</div>
                  <div class="flex gap-2">
                    <div class="flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-emerald-500/10 text-[9px] font-bold text-emerald-400 border border-emerald-500/20"><span class="material-icons-round text-[10px]">event</span> ${evCount}</div>
                    <div class="flex items-center gap-0.5 px-2 py-0.5 rounded-lg bg-orange-500/10 text-[9px] font-bold text-orange-400 border border-orange-500/20"><span class="material-icons-round text-[10px]">schedule</span> ${sessCount}</div>
                  </div>
                </div>
                <div class="text-[10px] font-bold text-primary-light uppercase tracking-widest mt-0.5 truncate">${m.role || 'Membre'}</div>
                <div class="text-[10px] text-muted truncate mt-1">${m.email || 'Pas d\'email'}</div>
              </div>
              <span class="material-icons-round text-white/10 shrink-0">chevron_right</span>
            </div>`;
          })}
          ${membres.length === 0 && html`<div class="text-center py-16 text-dimmed text-base border-2 border-dashed border-white/5 rounded-3xl">Aucun membre</div>`}
        </div>
      </div>`;

      return html`<div>
        <div class="md:grid md:grid-cols-12 md:gap-8 md:items-start md:h-[calc(100vh-140px)]">
          <div class="md:col-span-5 lg:col-span-4 ${detail ? 'hidden md:block' : ''} md:h-full md:overflow-y-auto scrollbar-hide md:pr-4">
            ${listPane}
          </div>
          ${detail ? html`<div class="md:col-span-7 lg:col-span-8 md:h-full md:overflow-y-auto scrollbar-hide">
            ${detailPane}
          </div>` : html`<div class="hidden md:flex flex-col md:col-span-7 lg:col-span-8 items-center justify-center h-full text-dimmed border-2 border-dashed border-white/10 rounded-[2rem] bg-white/5">
            <span class="material-icons-round text-6xl text-white/10 mb-4 block">groups</span>
            <p class="text-lg font-medium text-white/40">Sélectionnez un membre</p>
            <p class="text-xs text-white/20 mt-2">pour afficher ses informations et son activité</p>
          </div>`}
        </div>

        <${FAB} onClick=${() => { setEdit(null); setForm({ prenom: '', email: '', role: '' }); setShowForm(true) }} />

        <${Modal} open=${csvModal} onClose=${() => setCsvModal(false)} title="Aperçu import CSV">
          <div class="text-xs text-muted mb-3">${csvRows.length} membre(s) détecté(s) — les doublons (même email) seront ignorés.</div>
          <div class="max-h-64 overflow-y-auto scrollbar-hide space-y-1.5 mb-4">
            ${csvRows.map((r, i) => html`<div key=${i} class="flex items-center gap-3 p-2.5 bg-white/5 rounded-xl border border-white/5">
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-violet-700 flex items-center justify-center text-white font-bold text-sm shrink-0">${(r.prenom || '?')[0].toUpperCase()}</div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-semibold text-secondary truncate">${r.prenom}</div>
                <div class="text-[10px] text-muted truncate">${r.email || 'Pas d\'email'}${r.departement ? ' · ' + r.departement : ''}${r.classe ? ' · ' + r.classe : ''}</div>
              </div>
            </div>`)}
          </div>
          <div class="flex gap-3">
            <button onClick=${() => setCsvModal(false)} class="flex-1 py-3 rounded-xl bg-white/10 text-secondary text-sm font-medium">Annuler</button>
            <button onClick=${confirmCSVImport} class="flex-1 py-3 rounded-xl gradient-btn text-white text-sm font-bold">Importer ${csvRows.length} membre(s)</button>
          </div>
        <//>

        <${Modal} open=${!!memberToDelete} onClose=${() => setMemberToDelete(null)} title="Supprimer le membre">
          <div class="text-center py-4">
            <div class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4"><span class="material-icons-round text-red-500 text-3xl">person_remove</span></div>
            <p class="text-secondary font-bold text-lg mb-1">Confirmer la suppression ?</p>
            <p class="text-muted text-sm mb-6">Cette action est définitive et retirera le membre de tous les événements.</p>
            <div class="flex gap-3">

    // ═══════ CLIENTS TAB ═══════
    function ClientsTab({ toast, clients, events, recettes, produits, onBack }) {
      const [showForm, setShowForm] = useState(false);

      const [detail, setDetail] = useState(null);

      const [clientToDelete, setClientToDelete] = useState(null);
      const emptyForm = { nom: '', entreprise: '', email: '', telephone: '', notes: '' };
      const [form, setForm] = useState(emptyForm);

      const clientCA = (c) => events.filter(e => e.client_id === c.id).reduce((s, ev) => s + (parseFloat(ev.prix_vente_final) || 0), 0);
      const clientEvCount = (c) => events.filter(e => e.client_id === c.id).length;
      const clientLastDate = (c) => {
        const dates = events.filter(e => e.client_id === c.id && e.date).map(e => e.date).sort().reverse();
        return dates.length > 0 ? dates[0] : '';
      };

      const sortFns = {
        nom: (a, b) => (a.nom || '').localeCompare(b.nom || ''),
        ca: (a, b) => clientCA(b) - clientCA(a),
        events: (a, b) => clientEvCount(b) - clientEvCount(a),
        date: (a, b) => clientLastDate(b).localeCompare(clientLastDate(a)),
      };

      const sortOptions = [
        { id: 'nom', label: 'Nom', icon: 'sort_by_alpha' },
        { id: 'ca', label: 'CA', icon: 'euro' },
        { id: 'events', label: 'Events', icon: 'receipt_long' },
        { id: 'date', label: 'Date', icon: 'schedule' },
      ];

      const filtered = clients
        .filter(c => (c.nom || '').toLowerCase().includes(search.toLowerCase()) || (c.entreprise || '').toLowerCase().includes(search.toLowerCase()) || (c.email || '').toLowerCase().includes(search.toLowerCase()))
        .sort(sortFns[sortBy] || sortFns.nom);
      const save = () => {
        if (!form.nom) return toast('Nom requis', 'error');
        if (!form.email) return toast('Email requis', 'error');

      };
      const startEdit = (c) => { setForm({ nom: c.nom, entreprise: c.entreprise || '', email: c.email || '', telephone: c.telephone || '', notes: c.notes || '' }); setEdit(c); setShowForm(true); };
      const closeForm = () => { setShowForm(false); setEdit(null); setForm(emptyForm); };
      const executeDelClient = () => { if (!clientToDelete) return; DB.deleteClient(clientToDelete); setClientToDelete(null); setDetail(null); toast('Client supprimé', 'success'); };

      const detailPane = detail ? html`<div class="animate-fadeIn pb-20 md:pb-0">

    // ═══════ SETTINGS TAB ═══════
    function SettingsTab({ toast }) {
      const [pin, setPin] = useState(() => DB.getSetting('admin_pin', '1234'));
      const [email, setEmail] = useState(() => DB.getSetting('admin_email', ''));
      
      const save = () => {
        if(!pin || pin.length < 4) return toast('Le code PIN doit faire au moins 4 caractères', 'error');
        DB.setSetting('admin_pin', pin);
        DB.setSetting('admin_email', email);
        toast('Paramètres de sécurité mis à jour', 'success');
      };

      return html`<div class="pb-20 max-w-xl">
        <div class="glass glow rounded-3xl p-6 mb-6 animate-fadeIn">

          <p class="text-dimmed text-xs mb-6">Ce code PIN est utilisé pour protéger la modification des événements et l'accès à certaines données sensibles.</p>
          
          <${Field} label="Nouveau Code PIN Administrateur" placeholder="Ex: 1234" type="password" value=${pin} onInput=${e => setPin(e.target.value)} />
          <${Field} label="Email de secours (Optionnel)" placeholder="admin@imhi.fr" type="email" value=${email} onInput=${e => setEmail(e.target.value)} />
          
          <button onClick=${save} class="w-full mt-4 py-4 rounded-xl gradient-btn text-white font-bold tracking-wide active:scale-95 transition-all shadow-lg hover:shadow-primary/30">Mettre à jour la sécurité</button>
        </div>
      </div>`;
    }

      const addedProds = [];

      prodData.forEach(p => {
        let existing = currentProds.find(cp => cp.code_metro === p.code_metro || cp.nom === p.nom);
        if (!existing) {
          const ht = p.prix_achat_ttc / (1 + (p.tva / 100));
          const unitPriceHt = ht / p.u_contenu_q;
          const newP = { 
            ...p, 
            id: DB._id(), 
            prix_ht: unitPriceHt,
            unite: p.u_contenu_u,
            quantite: p.u_contenu_q,
            conditionnement: p.u_achat_nom
          };
          DB._w('produits', newP.id, newP);
          addedProds.push(newP);
        } else {
          addedProds.push(existing);
        }
      });

      const currentRecettes = Object.values(DB._local.get('recettes'));
      if (!currentRecettes.find(r => r.nom === 'Goûter Crêpes')) {
        const recipe = {
          id: DB._id(),
          nom: 'Goûter Crêpes',
          base_pax: 10,
          instructions: 'Servir les crêpes avec les différents accompagnements au choix (Nutella, confiture, Biscoff).',
          items: [
            { id_produit: addedProds.find(p => p.nom === 'Crepe')?.id, quantite_base: 20, unite_recette: 'pièce' },
            { id_produit: addedProds.find(p => p.nom === 'Apricot jam')?.id, quantite_base: 0.2, unite_recette: 'kg' },
            { id_produit: addedProds.find(p => p.nom === 'Biscoff Spread')?.id, quantite_base: 0.2, unite_recette: 'kg' },
            { id_produit: addedProds.find(p => p.nom === 'Nutella')?.id, quantite_base: 0.2, unite_recette: 'kg' }
          ].filter(i => i.id_produit)
        };
        DB._w('recettes', recipe.id, recipe);
      }
    }
    
    // Run bootstrap on load for the test
    setTimeout(bootstrapScreenshotTest, 500);

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
